asyncapi: 2.6.0
info:
  title: ChatGPT MCP SSH Gateway Events
  version: 0.3.0
defaultContentType: application/json
servers:
  jetstream:
    url: nats://nats:4222
    protocol: nats
    description: >-
      NATS JetStream. Concrete subjects are prefixed with gateway.events.;
      event JSON payloads remain the flat versioned schemas below, while audit
      and routing metadata is carried in NATS headers.
