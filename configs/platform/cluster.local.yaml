apiVersion: galaxy.perpetus.io/v1
kind: Cluster
metadata:
  name: local-dev
spec:
  environment: local
  ingress:
    publicBaseUrl: http://localhost:8000
  services:
    gateway-api:
      host: 0.0.0.0
      port: 8000
  dependencies:
    postgres:
      dsnEnv: DATABASE_URL
    docker:
      socket: /var/run/docker.sock
      optional: true
    keycloak:
      issuerEnv: KEYCLOAK_ISSUER
