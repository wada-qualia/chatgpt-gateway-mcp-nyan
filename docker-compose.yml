services:
  mcp-app:
    build: .
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      WORKSPACE_ROOT: /workspace
      AUTH_USERS_PATH: /auth/users.json
      AUTH_DEFAULT_SCOPES: "workspace:read workspace:write workspace:exec"
      AUTH_SUPPORTED_SCOPES: "workspace:read workspace:write workspace:exec"
      AUTH_ACCESS_TOKEN_TTL_SECONDS: "28800"
      MAX_COMMAND_TIMEOUT_SECONDS: "120"
      MAX_COMMAND_CHARS: "10000"
      MAX_FILE_READ_BYTES: "200000"
      MAX_FILE_WRITE_BYTES: "1000000"
      MAX_OUTPUT_CHARS: "30000"
      LOG_LEVEL: INFO
    volumes:
      - ./workspace:/workspace
      - ./auth:/auth
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http --log=stdout --log-format=logfmt --web-addr=0.0.0.0:4040 mcp-app:8000
    env_file:
      - .env
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in environment or .env before starting}
    depends_on:
      - mcp-app
    ports:
      - "4040:4040"
    restart: unless-stopped
