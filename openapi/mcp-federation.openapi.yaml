components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    McpCredentialBindingCreate:
      properties:
        binding_type:
          type: string
          enum:
          - oauth
          - service_account
          - thin_client_local
          title: Binding Type
        provider:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Provider
        secret_blob_id:
          anyOf:
          - type: string
            maxLength: 36
          - type: 'null'
          title: Secret Blob Id
        audience:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Audience
        scopes:
          items:
            type: string
          type: array
          maxItems: 100
          title: Scopes
        meta:
          additionalProperties: true
          type: object
          title: Meta
      additionalProperties: false
      type: object
      required:
      - binding_type
      title: McpCredentialBindingCreate
    McpCredentialBindingOut:
      properties:
        id:
          type: string
          title: Id
        owner_subject:
          type: string
          title: Owner Subject
        binding_type:
          type: string
          title: Binding Type
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        audience:
          anyOf:
          - type: string
          - type: 'null'
          title: Audience
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        status:
          type: string
          title: Status
        version:
          type: integer
          title: Version
        meta:
          additionalProperties: true
          type: object
          title: Meta
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        rotated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Rotated At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
      type: object
      required:
      - id
      - owner_subject
      - binding_type
      - scopes
      - status
      - version
      - meta
      - created_at
      - updated_at
      title: McpCredentialBindingOut
    McpCredentialCommand:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
      additionalProperties: false
      type: object
      required:
      - expected_version
      title: McpCredentialCommand
    McpCredentialMaterialCreate:
      properties:
        binding_type:
          type: string
          enum:
          - oauth
          - service_account
          title: Binding Type
        provider:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Provider
        audience:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Audience
        scopes:
          items:
            type: string
          type: array
          maxItems: 100
          title: Scopes
        mode:
          type: string
          enum:
          - bearer
          - header
          - oauth
          title: Mode
        access_token:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Access Token
        refresh_token:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Refresh Token
        token_endpoint:
          anyOf:
          - type: string
