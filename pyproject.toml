[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-mcp-ssh-gateway"
version = "0.3.7"
description = "Perpetus Galaxy FastAPI gateway for ChatGPT MCP SSH and Docker workspaces."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2,<3",
  "SQLAlchemy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.8,<3",
  "cryptography>=42,<47",
  "paramiko>=3.4,<4",
  "httpx>=0.27,<1",
  "mcp>=1.28.1,<2",
  "python-multipart>=0.0.9,<1",
  "websockets>=12,<16",
  "playwright>=1.55,<2",
  "nats-py>=2.15,<3",
  "rich>=13,<15"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1"
]

[project.scripts]
gateway-cli = "gateway_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["services/gateway-api", "cli"]

[tool.klab.lup-sdk]
package = "klab-llm-usage"
version = "0.1.0a0"
artifact = "vendor/llm-usage-sdk/klab_llm_usage-0.1.0a0-py3-none-any.whl"
sha256 = "71c96edfc73974e8f733713d0e3d7972df86ba6c54493ee46e1536c72facd2a3"
source-commit = "978a577c9c54f53c88fb2d94fd98f9f689126c58"
publication-channel = "jenkins-internal-artifact"
public-index-allowed = false
