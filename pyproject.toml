[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-mcp-ssh-gateway"
version = "0.11.5"
description = "Perpetus Galaxy FastAPI gateway for ChatGPT MCP SSH and Docker workspaces."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2,<3",
  "alembic>=1.18,<2",
  "SQLAlchemy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.8,<3",
  "cryptography>=42,<47",
  "paramiko>=3.4,<4",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.28.1,<2",
  "python-multipart>=0.0.9,<1",
  "websockets>=12,<16",
  "playwright>=1.55,<2",
  "nats-py>=2.15,<3",
  "rich>=13,<15"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1"
]

[project.scripts]
gateway-cli = "gateway_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["services/gateway-api", "cli"]

[tool.klab.lup-sdk]
package = "klab-llm-usage"
version = "0.1.0b2"
artifact = "vendor/llm-usage-sdk/klab_llm_usage-0.1.0b2-py3-none-any.whl"
sha256 = "eb5323f26fb5a2f0dcb5d1a0999c5bb7ef0acf83dd51cb9a7fcae77b42874e85"
source-commit = "52ab367a68b09db2730c14b626ce019f8a203a4d"
publication-channel = "jenkins-internal-artifact"
public-index-allowed = false

[tool.klab.affine-sdk]
package = "affine-py-sdk"
version = "0.5.0"
artifact = "vendor/affine-sdk/affine_py_sdk-0.5.0-py3-none-any.whl"
sha256 = "342feb348633b8741ddb91c3852be4734ce0b97017eca9f46815ef829174461a"
source-commit = "654998398c6b744235504e90b1b000ac7bf6dc6d"
publication-channel = "gateway-qualified-vendor"
public-index-allowed = false
