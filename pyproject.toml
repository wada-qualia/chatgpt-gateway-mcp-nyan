[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-gateway-mcp-nyan"
version = "0.13.9"
description = "Agent infrastructure control plane for MCP, remote execution, chat isolation, approvals and auditability."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2,<3",
  "alembic>=1.18,<2",
  "SQLAlchemy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.8,<3",
  "cryptography>=42,<47",
  "paramiko>=3.4,<4",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mcp>=2.1.1,<3",
  "python-multipart>=0.0.9,<1",
  "websockets>=12,<16",
  "playwright>=1.55,<2",
  "nats-py>=2.15,<3",
  "nkeys>=0.2.1,<0.3",
  "rich>=13,<15"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1"
]

[project.urls]
Homepage = "https://github.com/wada-qualia/chatgpt-gateway-mcp-nyan"
Repository = "https://github.com/wada-qualia/chatgpt-gateway-mcp-nyan"
Issues = "https://github.com/wada-qualia/chatgpt-gateway-mcp-nyan/issues"

[tool.setuptools.packages.find]
where = ["services/gateway-api"]
